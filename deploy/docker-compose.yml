# docker compose -f deploy/docker-compose.yml up -d --build
# برای فعال‌سازی LLM محلی: docker compose -f deploy/docker-compose.yml --profile llm up -d
#   سپس: docker exec -it rasad-ollama ollama pull qwen3:8b
services:
  rasad:
    build: { context: .., dockerfile: deploy/Dockerfile }
    container_name: rasad
    restart: unless-stopped
    ports: ["8080:8080"]
    env_file: [../.env]
    environment:
      RASAD_DB: /data/rasad.db
      RASAD_BACKUP_DIR: /data/backups
    volumes: [rasad-data:/data]
  ollama:
    image: ollama/ollama:latest
    container_name: rasad-ollama
    profiles: ["llm"]
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]
    # در .env بگذارید: LLM_BASE_URL=http://ollama:11434/v1
volumes:
  rasad-data: {}
  ollama: {}
