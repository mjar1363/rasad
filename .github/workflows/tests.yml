name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-media.txt
      - run: python -m compileall -q rasad
      - run: pytest -q
        env:
          RASAD_AUTH: '0'
          RASAD_MODE: manual
          LLM_BASE_URL: ''
          LLM_API_KEY: ''
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: for file in web/js/*.js; do node --input-type=module --check < "$file"; done
